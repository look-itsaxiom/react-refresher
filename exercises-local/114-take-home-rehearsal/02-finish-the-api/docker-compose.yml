# docker-compose.yml
#
# Local Postgres for the take-home. Not exercised by any test here -- it's
# the piece a reviewer runs first, so it has to work in one command:
#   docker compose up -d
services:
  db:
    image: postgres:17 # hedge: pin to the exact 17.x tag your migrations were tested against before submitting
    environment:
      POSTGRES_USER: takehome
      POSTGRES_PASSWORD: takehome
      POSTGRES_DB: takehome
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U takehome']
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - takehome-db:/var/lib/postgresql/data

volumes:
  takehome-db:
