# ci.yml
#
# Named "github-workflows" instead of ".github/workflows" on purpose: a
# leading dot would make this exercise's Go tooling and the app's file
# browser treat it as a hidden directory. In a real repo this file lives at
# .github/workflows/ci.yml -- move it there before you push.
#
# Third-party actions are pinned to a commit SHA, not a mutable tag, per
# lesson 68: a compromised tag can silently swap the code a workflow runs,
# a pinned SHA can't.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: takehome
          POSTGRES_PASSWORD: takehome
          POSTGRES_DB: takehome
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U takehome"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        env:
          DATABASE_URL: postgres://takehome:takehome@localhost:5432/takehome?sslmode=disable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
